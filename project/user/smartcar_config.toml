# 统一参数入口。
# 约定：
# 1. 启动时必须成功加载这份文件，否则程序直接退出。
# 2. 文件中每个已知参数都必须显式出现，避免“代码里还残留一个默认值入口”。

[meta]
# 配置文件格式版本号。
# 作用：约束解析器按哪一版字段表解释当前文件。
schema_version = 1

[vision.runtime]
# 推理总开关。
# false 时关闭红框检测和 ncnn 分类主链。
infer_enabled = false
# ncnn 分类子开关。
# false 时即使 infer_enabled=true，也只保留红框检测，不做 ncnn 分类。
ncnn_enabled = false
# 车载屏显示开关。
# true 时启动屏幕显示线程。
screen_display_enabled = false
# 迷宫法起始搜索行。
# 值越大越靠近图像底部。
maze_start_row = 60
# 原图巡线方法。
# 0=迷宫法，1=八邻域法。
maze_trace_method = 1
# 迷宫法 y 回退停止阈值。
# 当后续 y 大于当前最小 y + 该阈值时停止追踪。
maze_trace_y_fallback_stop_delta = 15
# 十字下角点 dir 模板识别开关。
# true 时在八邻域 dir 序列上做平台跳变识别。
cross_lower_corner_dir_enabled = true
# 十字下角点前平台窗口长度。
# 用于检查角点前是否形成足够长的 {4,5}/{5,6} 平台。
cross_lower_corner_pre_window = 8
# 十字下角点后平台窗口长度。
# 用于检查角点后是否形成足够长的 {1,2}/{2,3} 平台。
cross_lower_corner_post_window = 8
# 十字下角点前平台最少投票数。
cross_lower_corner_pre_min_votes = 7
# 十字下角点后平台最少投票数。
cross_lower_corner_post_min_votes = 7
# 十字下角点平台间允许的最大过渡长度。
cross_lower_corner_transition_max_len = 4
# 左右下角点 y 坐标最大允许差值。
# 超出后不认为双边角点稳定同时成立。
cross_lower_corner_pair_y_diff_max = 30
# 十字下角点跳变精修：规则边界搜索窗口半宽（点数）。
cross_lower_corner_jump_window = 10
# 十字下角点跳变精修：x跳变幅度判据的倍率阈值。
cross_lower_corner_jump_ratio = 1
# 原图直边判断时检查的边界前部点数。
src_boundary_straight_check_count = 80
# 原图直边判断中 dir=4/5 的最小占比阈值。
# 取值范围通常为 [0,1]。
src_boundary_straight_dir45_ratio_min = 0.95
# 去畸变开关。
# true 时使用相机标定参数做去畸变。
undistort_enabled = false
# IPM 边界三角滤波开关。
# true 时对 IPM 边界点做一次 1-2-1 平滑。
ipm_triangle_filter_enabled = true
# IPM 边界等距采样开关。
ipm_resample_enabled = true
# IPM 边界等距采样步长，单位像素。
ipm_resample_step_px = 3.0
# IPM 边界顺序近点去重阈值，单位像素。
ipm_boundary_min_point_dist_px = 1.4
# IPM 边界回跳毛刺判定中的短段长度阈值，单位像素。
ipm_boundary_spike_short_seg_max_px = 2.0
# IPM 边界回跳毛刺判定中的反向 cos 阈值。
ipm_boundary_spike_reverse_cos_threshold = -0.2
# IPM 边界三点法夹角计算步长。
ipm_boundary_angle_step = 3
# IPM 角点候选的 cos 阈值。
# 小于等于该值时进入角点候选判定。
ipm_boundary_corner_cos_threshold = 0.5
# IPM 角点 NMS 半径。
ipm_boundary_corner_nms_radius = 3
# IPM 首角点后截断开关。
# true 时检测到第一个角点后截断其后的边界点。
ipm_boundary_truncate_at_first_corner_enabled = true
# IPM 直边检测要求的最小边界点数。
ipm_boundary_straight_min_points = 30
# IPM 直边检测窗口长度。
ipm_boundary_straight_check_count = 20
# IPM 直边检测要求的最小 cos 阈值。
ipm_boundary_straight_min_cos = 0.95
# IPM 赛道宽度像素。
ipm_track_width_px = 30.0
# 默认目标中线距离左边界的偏移像素。
ipm_center_target_offset_from_left_px = 15.0
# 进入目标板状态前，需要连续多少帧同类高置信 Top1。
infer_target_confirm_count = 5
# 目标板确认的 Top1 置信度阈值。
infer_target_confidence_threshold = 0.7
# 绕行相对偏移 n：武器 default-n，物资 default+n，车辆 default。
infer_avoid_offset_delta_px = 14.0
# 目标板状态恢复默认值前允许连续无红框的帧数。
infer_target_exit_no_red_count = 5
# IPM 中线后处理总开关。
# 控制去重、平滑和重采样等后处理步骤。
ipm_centerline_postprocess_enabled = true
# IPM 中线三角滤波开关。
ipm_centerline_triangle_filter_enabled = true
# IPM 中线等距采样开关。
ipm_centerline_resample_enabled = true
# IPM 中线等距采样步长，单位像素。
ipm_centerline_resample_step_px = 3.0
# IPM 回投到原图后的左右边界/中线二次等距采样开关。
src_backproj_resample_enabled = true
# IPM 回投到原图后的左右边界/中线二次等距采样步长，单位像素。
src_backproj_resample_step_px = 2.0
# IPM 中线曲率计算开关。
ipm_centerline_curvature_enabled = true
# IPM 中线曲率计算步长。
ipm_centerline_curvature_step = 3
# 斑马线检测总开关。
zebra_cross_detection_enabled = false
# 双边都丢线时是否保留上一帧平移中线。
keep_last_centerline_on_double_loss = false
# 圆环状态识别开关。
route_circle_detection_enabled = false
# 圆环入口判定中对侧边界最少点数要求。
route_circle_entry_min_boundary_count = 20
# 圆环入口判定中角点距离对侧边界尾部的最小保留余量。
route_circle_entry_corner_tail_margin = 20
# 圆环入口判定中，从角点 y 向上偏移后开始检查边界间距的行偏移。
route_circle_entry_corner_row_offset = 0
# 圆环入口判定中连续检查原始边界间距的行数。
route_circle_entry_gap_check_rows = 0
# 圆环入口判定中原始左右边界最小间距阈值。
route_circle_entry_min_raw_boundary_gap = 0
# 圆环入口判定中角点 y 最小阈值。
route_circle_entry_corner_y_min = 60
# 圆环状态 1/5 进入下一阶段的起始贴边连续行数阈值。
route_circle_stage_frame_wall_rows_enter = 30
# 圆环状态 3 进入下一阶段的对侧起始贴边连续行数阈值。
route_circle_stage3_frame_wall_rows_trigger = 70
# 圆环状态 6 抬高迷宫法搜线起始行的上限（行号越小越靠上）。
route_circle_stage6_maze_start_row = 60
# 圆环状态 circle4/5 的目标中线相对左边界偏移。
route_circle_center_target_offset_from_left_px = 15.0
# 圆环补线中贴边连续段的最小长度阈值。
circle_guide_min_frame_wall_segment_len = 8
# 圆环 state3 补线目标点向后偏移的索引数。
circle_guide_target_offset_stage3 = 5
# 圆环 state5 补线锚点向后偏移的索引数。
circle_guide_anchor_offset_stage5 = 0
# 圆环送 IPM 前触边判定边距（像素）。
route_circle_apply_touch_margin_px = 2
# straight 判定固定窗口最少中线点数。
route_straight_min_centerline_points = 35
# 进入 straight 状态所需的连续满足帧数。
route_straight_enter_consecutive_frames = 2
# straight 判定中固定窗口（前 N 点）绝对误差和上限。
route_straight_abs_error_sum_max = 50.0
# cross_1 中辅助点从起始行边界点同 x 向上扫描白黑转变的最大行数。
cross_aux_vertical_scan_max_rows = 75
# cross_1 辅助八邻域边界允许的最大点数。
cross_aux_trace_max_points = 50
# cross_1 辅助边界向上延伸的最大行数。
cross_aux_trace_upward_rows_max = 30
# 十字辅助边界重捕获：以上次辅助起点为中心向上搜索的像素数。
cross_aux_reacquire_up_px = 2
# 十字辅助边界重捕获：以上次辅助起点为中心向下搜索的像素数。
cross_aux_reacquire_down_px = 5
# 十字辅助边界拟合扫描：参与局部拟合的下角点前置 trace 点数。
cross_aux_fit_prev_points = 3
# 十字辅助边界拟合扫描：左侧斜率减、右侧斜率加的外侧偏置量。
cross_aux_fit_slope_bias = 0.5
# 十字上角点：命中 dir=5 后，后续需连续多少个点满足 dir<=5。
cross_upper_dir5_post_check_count = 3
# 十字辅助边界：历史过渡点与下角点的最小 x 偏移像素数。
cross_aux_history_x_offset = 3
# line_error 偏好使用的中线来源。
# 0=左平移，1=右平移，2=自动。
ipm_line_error_source = 2
# line_error 计算方法。
# 0=固定索引，1=离散点位加权索引，2=随速度索引，3=前缀指数加权索引。
ipm_line_error_method = 1
# line_error 固定索引模式下的中线点索引（0-based，仅 method=0 生效）。
ipm_line_error_fixed_index = 8
# line_error 离散加权模式使用的点数量（仅 method=1 生效）。
ipm_line_error_weighted_point_count = 3
# line_error 离散加权模式的索引点（0-based，仅 method=1 生效）。
ipm_line_error_point_indices = [2, 6, 10]
# line_error 离散加权模式的各索引点权重（仅 method=1 生效）。
ipm_line_error_weights = [0.6, 0.3, 0.1]
# line_error 随速度索引公式系数 k（idx = k * speed + b，仅 method=2 生效）。
ipm_line_error_speed_k = 0.03
# line_error 随速度索引公式常数项 b（idx = k * speed + b，仅 method=2 生效）。
ipm_line_error_speed_b = 2.0
# line_error 随速度索引最小限制（仅 method=2 生效）。
ipm_line_error_index_min = 0
# line_error 随速度索引最大限制（仅 method=2 生效）。
ipm_line_error_index_max = 30
# line_error 前缀指数加权使用的前缀比例（0,1]，仅 method=3 生效）。
ipm_line_error_prefix_ratio = 0.6
# line_error 前缀指数加权的指数参数 lambda（仅 method=3 生效）。
ipm_line_error_exp_lambda = 2.303

[vision.runtime.ncnn]
# ncnn 模型输入宽度。
input_width = 64
# ncnn 模型输入高度。
input_height = 64
# ncnn 标签数量。
# 必须与 labels 数组长度一致。
label_count = 6
# ncnn 类别标签表。
# 顺序必须与模型输出类别顺序一致。
labels = ["ambulance", "armored_car", "bomb", "gun", "medicine", "telescope"]

[vision.runtime.red_roi]
# 红色提示矩形下底边中点到目标物下底边中点的距离斜率（IPM 空间）。
# gap_ipm = k * dist_ipm + b。
red_to_target_bottom_k = -0.05
# 红色提示矩形下底边中点到目标物下底边中点的距离截距（IPM 像素）。
red_to_target_bottom_b = 1.5
# IPM 中截取目标板正方形边长（像素）。
# 45cm 赛道宽对应 30px 时，12cm 目标板约为 8px。
square_side_px = 8.0

[vision.runtime.web]
# 网页端 UDP 图传总开关。
enabled = false
# 网页端 UDP 图传最大发送帧率。
# 0 表示不限速。
max_fps = 30
# 是否发送灰度图。
send_gray_jpeg = true
# 灰度图发送格式。
# 0=JPEG，1=PNG，2=BMP。
gray_image_format = 0
# 是否发送二值图。
send_binary_jpeg = true
# 二值图发送格式。
# 0=JPEG，1=PNG，2=BMP。
binary_image_format = 0
# 是否发送彩图。
send_rgb_jpeg = false
# 彩图发送格式。
# 0=JPEG，1=PNG，2=BMP。
rgb_image_format = 1
# 网页数据模式。
# 0=FULL，1=RAW_MINIMAL。
data_profile = 0
# 网页端 TCP 状态发送总开关。
tcp_enabled = false
# PC 接收端 IP 地址。
server_ip = "192.168.3.11"
# PC 接收端 UDP 视频端口。
video_port = 10000
# PC 接收端 TCP 状态端口。
meta_port = 10001

[vision.runtime.web.tcp]
# 是否发送毫秒级时间戳。
ts_ms = false
# 是否发送 line_error。
line_error = true
# 是否发送 CPU 占用百分比。
cpu_usage_percent = true
# 是否发送内存占用百分比。
mem_usage_percent = true
# 是否发送基础速度。
base_speed = true
# 是否发送左轮目标速度。
left_target_count = true
# 是否发送右轮目标速度。
right_target_count = true
# 是否发送左轮当前编码器速度。
left_current_count = true
# 是否发送右轮当前编码器速度。
right_current_count = true
# 是否发送左轮滤波后速度。
left_filtered_count = false
# 是否发送右轮滤波后速度。
right_filtered_count = false
# 是否发送左轮速度误差。
left_error = false
# 是否发送右轮速度误差。
right_error = false
# 是否发送左轮前馈输出。
left_feedforward = false
# 是否发送右轮前馈输出。
right_feedforward = false
# 是否发送左轮 PID 修正项。
left_correction = false
# 是否发送右轮 PID 修正项。
right_correction = false
# 是否发送左轮减速辅助项。
left_decel_assist = false
# 是否发送右轮减速辅助项。
right_decel_assist = false
# 是否发送左轮 duty。
left_duty = false
# 是否发送右轮 duty。
right_duty = false
# 是否发送左轮硬件 duty。
left_hardware_duty = false
# 是否发送右轮硬件 duty。
right_hardware_duty = false
# 是否发送左轮方向 GPIO 电平。
left_dir_level = false
# 是否发送右轮方向 GPIO 电平。
right_dir_level = false
# 是否发送当前 otsu 阈值。
otsu_threshold = true
# 是否发送等待新图像耗时。
perf_capture_wait_us = false
# 是否发送预处理耗时。
perf_preprocess_us = false
# 是否发送 otsu 阶段耗时。
perf_otsu_us = false
# 是否发送迷宫法阶段耗时。
perf_maze_us = false
# 是否发送整帧总耗时。
perf_total_us = true
# 是否发送左边界原始真实点数。
maze_left_points_raw = true
# 是否发送右边界原始真实点数。
maze_right_points_raw = true
# 是否发送红框是否存在。
red_found = false
# 是否发送红框矩形。
red_rect = false
# 是否发送 ROI 是否有效。
roi_valid = false
# 是否发送 ROI 矩形。
roi_rect = false
# 是否发送当前 IPM 跟踪点是否有效。
ipm_track_valid = true
# 是否发送 line_error 取点方式。
ipm_track_method = false
# 是否发送当前选中的中线来源。
ipm_centerline_source = false
# 是否发送当前实际使用的中线点索引。
ipm_track_index = false
# 是否发送当前实际跟踪点坐标。
ipm_track_point = true
# 是否发送原图左边界点列。
left_boundary = true
# 是否发送原图右边界点列。
right_boundary = true
# 是否发送 IPM 左边界点列。
ipm_left_boundary = true
# 是否发送 IPM 右边界点列。
ipm_right_boundary = true
# 是否发送当前选中的 IPM 平移中线。
ipm_centerline_selected_shift = true
# 是否发送当前选中的原图回投平移中线。
src_centerline_selected_shift = true
# 是否发送当前选中的 IPM 平移中线点数。
ipm_centerline_selected_count = true
# 是否发送当前选中的原图回投平移中线点数。
src_centerline_selected_count = true
# 是否发送当前选中的 IPM 平移中线曲率数组。
ipm_centerline_selected_curvature = true
# 是否发送灰度图尺寸。
gray_size = true
# 是否发送 IPM 图尺寸。
ipm_size = true

[vision.processor]
# 单侧迷宫法最大输出点数。
maze_trace_max_points = 180
# 迷宫法允许追踪的纵向区域百分比。
# 100 表示全高。
maze_lower_region_percent = 100
# 二值化模式。
# 0=全图OTSU, 1=按需局部均值自适应, 2=全图局部均值自适应。
binarization_mode = 0
# 自适应窗口大小，单位像素（仅 mode=1/2，建议奇数 5~9）。
adaptive_window_size = 7
# 自适应阈值常数，threshold = mean - constant（仅 mode=1/2）。
adaptive_constant = 10
# 是否启用逆透视流程。
enable_inverse_perspective = true
# 逆透视输出宽度。
ipm_output_width = 160
# 逆透视输出高度。
ipm_output_height = 100
# 逆透视矩阵。
# 按 3x3 展平写入，顺序为行优先。
change_un_mat = [-0.023810, 0.028286, -1.980497, -0.000000, 0.000232, -0.656427, -0.000000, 0.000372, -0.050283]
# 相机内参矩阵。
# 按 3x3 展平写入，顺序为行优先。
camera_matrix = [88.352003, 0.0, 76.039402, 0.0, 88.094982, 30.149306, 0.0, 0.0, 1.0]
# 畸变系数数组。
# 顺序为 [k1, k2, p1, p2, k3]。
dist_coeffs = [0.301435, -0.683306, -0.001952, -0.01992, 0.420358]
# 去畸变后 x 方向平移补偿。
undistort_move_x = 2
# 去畸变后 y 方向平移补偿。
undistort_move_y = -2
# line_error 默认采样行比例。
default_line_sample_ratio = 0.55
# 迷宫法默认允许搜索的最小 x。
default_maze_trace_x_min = 1
# 迷宫法默认允许搜索的最大 x。
default_maze_trace_x_max = 159

[vision.processor.crop]
# 原图裁剪上边界，与 denominator 配合换算为比例。
# crop_y = UVC_HEIGHT * top / denominator
top = 15
# 原图裁剪下边界，与 denominator 配合换算为比例。
# crop_h = UVC_HEIGHT * (bottom - top) / denominator
bottom = 75
# 原图裁剪分母，默认 120。
denominator = 120

[pid.imu]
# 启动阶段 IMU 静止标定时长，单位毫秒。
startup_calibrate_duration_ms = 2000
# gyro_z 方向符号。
# 越抗漂越甩时通常要改成 -1。（此处修改陀螺仪方向）
gyro_yaw_rate_sign = -1.0
# gyro_z 低通滤波 alpha。
gyro_yaw_rate_filter_alpha = 0.45

[pid.motor_speed]
# 左轮速度环 Kp。
left_kp = 0.22
# 左轮速度环 Ki。
left_ki = 0.0
# 左轮速度环 Kd。
left_kd = 0.0
# 右轮速度环 Kp。
right_kp = 0.19
# 右轮速度环 Ki。
right_ki = 0.0
# 右轮速度环 Kd。
right_kd = 0.0
# 速度环积分限幅。
integral_limit = 0.0
# 单周期 PID 修正项最大变化步长。
max_output_step = 9.0
