<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Car Dashboard</title>
<style>
/* ============================================================
   Race Telemetry Console — Design System
   ============================================================ */
:root {
  --bg-deep: #080d14;
  --bg-panel: rgba(12, 18, 28, 0.94);
  --bg-card: rgba(14, 20, 32, 0.92);
  --border-subtle: rgba(56, 189, 248, 0.10);
  --border-panel: rgba(56, 189, 248, 0.14);
  --border-active: rgba(56, 189, 248, 0.32);
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --ok: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --text-primary: #e2e8f0;
  --text-secondary: #b0bec5;
  --text-muted: #78909c;
  --text-value: #f8fafc;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
  --font-sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --spacing-unit: 4px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background:
    radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.04), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(34, 197, 94, 0.03), transparent 50%),
    radial-gradient(circle, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px;
  background-color: var(--bg-deep);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.dashboard {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== Hero Bar (44px fixed) ===== */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 44px;
  padding: 0 16px;
  flex-shrink: 0;
  background: rgba(10, 16, 24, 0.96);
  border-bottom: 1px solid rgba(56, 189, 248, 0.12);
  box-shadow: 0 1px 0 rgba(56, 189, 248, 0.04);
}

.hero-left { display: flex; align-items: center; gap: 4px; }

.preset-btn {
  padding: 6px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-sans);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.preset-btn:hover { color: var(--text-secondary); }
.preset-btn:active { transform: scale(0.97); }
.preset-btn.active {
  background: rgba(56, 189, 248, 0.14);
  color: var(--accent);
  border-color: var(--border-active);
  box-shadow: 0 0 16px var(--accent-glow);
}

.hero-right { display: flex; align-items: center; gap: 12px; }

.status-pill {
  padding: 3px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-mono);
  border: 1px solid;
  transition: color 0.3s, background 0.3s, border-color 0.3s;
}
.status-pill.ok {
  background: rgba(34, 197, 94, 0.12);
  color: var(--ok);
  border-color: rgba(34, 197, 94, 0.25);
}
.status-pill.warn {
  background: rgba(245, 158, 11, 0.12);
  color: var(--warn);
  border-color: rgba(245, 158, 11, 0.25);
}
.status-pill.danger {
  background: rgba(239, 68, 68, 0.12);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.25);
}

.btn-hero {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: var(--font-sans);
  font-weight: 500;
  border: 1px solid rgba(56, 189, 248, 0.18);
  background: rgba(14, 20, 32, 0.8);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-hero:hover { background: rgba(56, 189, 248, 0.12); color: var(--text-primary); }
.btn-hero:active { transform: scale(0.97); }

.btn-hero.recording {
  background: rgba(239, 68, 68, 0.16);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.4);
  animation: pulse-record 2s ease-in-out infinite;
}

@keyframes pulse-record {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
}

.rec-status {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ===== Main Layout ===== */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  gap: 8px;
  padding: 8px;
}

.left-col {
  width: 30%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

/* ===== Image Cards ===== */
.img-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-panel);
  border-radius: 10px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow:
    inset 0 0 20px rgba(0, 0, 0, 0.4),
    0 2px 8px rgba(0, 0, 0, 0.3);
}

.img-card .img-title {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  letter-spacing: 0.04em;
}

.img-card canvas {
  width: 100%;
  border-radius: 4px;
  image-rendering: pixelated;
  background: #000;
  border: 1px solid rgba(0, 0, 0, 0.6);
  flex: 1;
  min-height: 0;
}

/* ===== Overlay Toggles ===== */
.overlay-toggles {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  padding: 8px 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border-panel);
  border-radius: 10px;
}
.overlay-toggles label {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
  min-height: 28px;
  padding: 2px 4px;
}
.overlay-toggles input[type="checkbox"] {
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
}

/* ===== L1 Cards Row ===== */
.cards-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  flex-shrink: 0;
}

.l1-card {
  background: var(--bg-card);
  border: 1px solid rgba(56, 189, 248, 0.14);
  border-radius: 10px;
  padding: 16px 12px;
  text-align: center;
  position: relative;
  overflow: hidden;
  height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.l1-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 14px;
  height: 2px;
  background: var(--accent);
  opacity: 0.7;
  border-radius: 0 0 2px 0;
}
.l1-card:hover {
  border-color: var(--border-active);
  box-shadow: 0 2px 12px var(--accent-glow);
}

.l1-card .l1-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: var(--font-sans);
  font-weight: 500;
  margin-bottom: 6px;
}

.l1-card .l1-value {
  font-size: 32px;
  font-weight: 700;
  color: var(--text-value);
  font-family: var(--font-mono);
  line-height: 1;
  text-shadow: 0 0 20px var(--accent-glow);
}

.l1-card .l1-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 4px;
}

/* ===== Panels Area ===== */
.panels-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.panel.open { border-color: var(--border-panel); }

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
  min-height: 40px;
  border-left: 2px solid transparent;
  border-radius: 10px 10px 0 0;
  transition: border-color 0.2s, background 0.2s;
}
.panel-header:hover { background: rgba(56, 189, 248, 0.04); }
.panel-header:active { transform: scale(0.995); }

.panel.open .panel-header {
  border-left-color: var(--accent);
  background: rgba(56, 189, 248, 0.04);
}

.panel-header .panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  font-family: var(--font-sans);
}

.panel-header .panel-arrow {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  transition: transform 0.25s ease;
}

.panel.open .panel-arrow { transform: rotate(90deg); color: var(--accent); }

.panel-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.panel.open .panel-body {
  max-height: 360px;
  overflow-y: auto;
  padding: 0 12px 10px;
}

/* ===== Panel Table ===== */
.panel-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-family: var(--font-mono);
}
.panel-table td {
  padding: 3px 8px;
  border-bottom: 1px solid rgba(56, 189, 248, 0.06);
}
.panel-table .key { color: var(--text-muted); white-space: nowrap; width: 1%; }
.panel-table .val { color: var(--text-primary); text-align: right; }

.pid-empty {
  color: var(--text-muted);
  font-size: 12px;
  font-style: italic;
  padding: 8px 0;
}

/* PID 3-column grid */
.pid-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.pid-col-title {
  font-weight: 700;
  font-size: 12px;
  color: var(--text-primary);
  margin-bottom: 6px;
  font-family: var(--font-sans);
}

/* ===== Playback Bar ===== */
.playback-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  flex-shrink: 0;
  background: rgba(14, 20, 32, 0.98);
  border-top: 1px solid rgba(245, 158, 11, 0.25);
  font-family: var(--font-mono);
  font-size: 12px;
}
.playback-bar.visible { display: flex; }
.playback-bar button {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid rgba(56, 189, 248, 0.18);
  background: rgba(14, 20, 32, 0.8);
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all 0.2s;
}
.playback-bar button:hover { background: rgba(56, 189, 248, 0.12); color: var(--text-primary); }
.playback-bar button:active { transform: scale(0.97); }
.playback-bar .pb-time { color: var(--text-secondary); white-space: nowrap; }
.playback-bar input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  height: 4px;
}

/* ===== Params Sidebar ===== */
.params-panel {
  display: none;
  flex-direction: column;
  gap: 12px;
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: 340px;
  z-index: 100;
  background: rgba(8, 13, 20, 0.98);
  border-left: 1px solid rgba(56, 189, 248, 0.2);
  padding: 20px;
  overflow-y: auto;
  box-shadow: -4px 0 24px rgba(0, 0, 0, 0.4);
}
.params-panel.visible { display: flex; }
.params-panel h3 {
  font-size: 15px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-weight: 700;
}
.params-panel label {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  margin-bottom: 2px;
}
.params-panel input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.params-panel .param-val {
  font-size: 12px;
  color: var(--accent);
  font-family: var(--font-mono);
  min-width: 48px;
  text-align: right;
}
.params-panel .param-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

/* ===== Scrollbar ===== */
.panels-area::-webkit-scrollbar,
.panel-body::-webkit-scrollbar,
.params-panel::-webkit-scrollbar { width: 4px; }
.panels-area::-webkit-scrollbar-thumb,
.panel-body::-webkit-scrollbar-thumb,
.params-panel::-webkit-scrollbar-thumb {
  background: rgba(56, 189, 248, 0.15);
  border-radius: 2px;
}
.panels-area::-webkit-scrollbar-track,
.panel-body::-webkit-scrollbar-track,
.params-panel::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="dashboard">

  <!-- ===== Hero Bar ===== -->
  <div class="hero">
    <div class="hero-left">
      <button class="preset-btn active" data-preset="drive">驾驶</button>
      <button class="preset-btn" data-preset="vision">视觉调试</button>
      <button class="preset-btn" data-preset="control">车控调试</button>
    </div>
    <div class="hero-right">
      <span class="status-pill" id="connPill">--</span>
      <span class="status-pill" id="fpsPill">-- fps</span>
      <button class="btn-hero" id="paramsBtn">参数</button>
      <button class="btn-hero" id="recordBtn">录制</button>
      <span class="rec-status" id="recordStatus"></span>
    </div>
  </div>

  <!-- ===== Main ===== -->
  <div class="main">

    <!-- Left Col: Images -->
    <div class="left-col">
      <div class="img-card" style="flex:1;">
        <div class="img-title"><span>灰度图</span><span id="grayPixel">-</span></div>
        <canvas id="grayCanvas" width="320" height="240"></canvas>
      </div>
      <div class="img-card">
        <div class="img-title"><span>IPM 透视图</span><span id="ipmPixel">-</span></div>
        <canvas id="ipmCanvas" width="400" height="120"></canvas>
      </div>
      <div class="overlay-toggles" id="overlayToggles">
        <label><input type="checkbox" id="togBoundary" checked>边界</label>
        <label><input type="checkbox" id="togCenterline">中线</label>
        <label><input type="checkbox" id="togAnchor" checked>锚点</label>
        <label><input type="checkbox" id="togDir">dir图</label>
        <label><input type="checkbox" id="togSamplePoints">采样点</label>
      </div>
    </div>

    <!-- Right Col: Data -->
    <div class="right-col">

      <!-- L1 Cards -->
      <div class="cards-row" id="cardsRow">
        <div class="l1-card" id="card0"><div class="l1-label">--</div><div class="l1-value">--</div></div>
        <div class="l1-card" id="card1"><div class="l1-label">--</div><div class="l1-value">--</div></div>
        <div class="l1-card" id="card2"><div class="l1-label">--</div><div class="l1-value">--</div></div>
        <div class="l1-card" id="card3"><div class="l1-label">--</div><div class="l1-value">--</div></div>
        <div class="l1-card" id="card4"><div class="l1-label">--</div><div class="l1-value">--</div></div>
        <div class="l1-card" id="card5"><div class="l1-label">--</div><div class="l1-value">--</div></div>
      </div>

      <!-- L3 Collapsible Panels -->
      <div class="panels-area" id="panelsArea">
        <div class="panel" id="panelRoute">
          <div class="panel-header" data-panel="route">
            <span class="panel-title">元素状态机详情</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelRouteBody"></div>
        </div>

        <div class="panel" id="panelDetour">
          <div class="panel-header" data-panel="detour">
            <span class="panel-title">绕行状态机详情</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelDetourBody"></div>
        </div>

        <div class="panel" id="panelPid">
          <div class="panel-header" data-panel="pid">
            <span class="panel-title">PID 参数详情</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelPidBody"></div>
        </div>

        <div class="panel" id="panelGyro">
          <div class="panel-header" data-panel="gyro">
            <span class="panel-title">陀螺仪数据</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelGyroBody"></div>
        </div>

        <div class="panel" id="panelDir">
          <div class="panel-header" data-panel="dir">
            <span class="panel-title">dir 数组</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelDirBody"></div>
        </div>

        <div class="panel" id="panelTransport">
          <div class="panel-header" data-panel="transport">
            <span class="panel-title">传输状态详情</span>
            <span class="panel-arrow">▶</span>
          </div>
          <div class="panel-body" id="panelTransportBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Playback Bar ===== -->
  <div class="playback-bar" id="playbackBar">
    <button id="pbPlay">▶</button>
    <button id="pbBack">⏪ -1s</button>
    <button id="pbFwd">⏩ +1s</button>
    <span class="pb-time" id="pbTime">00:00 / 00:00</span>
    <input type="range" id="pbSeek" min="0" max="100" value="0">
    <button id="pbClose">关闭</button>
  </div>

  <!-- ===== Quick Params Sidebar ===== -->
  <div class="params-panel" id="paramsPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>快捷调参</h3>
      <button id="paramsCloseBtn" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div id="paramsContent"></div>
    <button id="paramsApplyBtn" class="btn-hero" style="width:100%;margin-top:4px;padding:10px;font-size:13px;">应用（优先热更新）</button>
    <div id="paramsResult" style="font-size:11px;color:var(--text-muted);margin-top:4px;"></div>
  </div>

</div>

<script src="shared_receiver_core.js"></script>
<script src="dashboard_cards.js"></script>
<script src="dashboard_panels.js"></script>
<script src="dashboard_overlay.js"></script>
<script src="dashboard_playback.js"></script>
<script src="dashboard_params.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
