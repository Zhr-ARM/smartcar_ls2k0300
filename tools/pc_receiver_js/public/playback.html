<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vision Playback Handoff</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07111f;
      color: #e2e8f0;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .handoff {
      max-width: 520px;
      padding: 24px;
      border: 1px solid rgba(71, 85, 105, 0.9);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.96);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.25;
    }
    p,
    pre {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="handoff">
    <h1>回放入口已合并</h1>
    <p id="sourceLabel">正在打开统一控制台...</p>
    <pre id="rawStatus"></pre>
  </main>
  <script src="/playback_app.js"></script>
</body>
</html>
